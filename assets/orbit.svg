<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(500,200)" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
    <circle r="150" fill="none" stroke="#7c3aed" stroke-opacity="0.25" stroke-dasharray="4 8"/>
    <circle r="105" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-dasharray="4 8"/>
    <circle r="62" fill="none" stroke="#e879f9" stroke-opacity="0.3" stroke-dasharray="4 8"/>

    <circle r="46" fill="url(#core)">
      <animate attributeName="r" values="42;50;42" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text y="5" fill="#ffffff" font-weight="700" font-size="13">raztven</text>

    <!-- ring 1 -->
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
      <g transform="translate(62,0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="16s" repeatCount="indefinite"/>
        <rect x="-34" y="-12" width="68" height="24" rx="12" fill="#1e1b4b" stroke="#e879f9"/><text y="4" fill="#e6edf3">Kotlin</text></g></g>
    </g>
    <g><animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="16s" repeatCount="indefinite"/>
      <g transform="translate(62,0)"><g><animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="16s" repeatCount="indefinite"/>
        <rect x="-34" y="-12" width="68" height="24" rx="12" fill="#1e1b4b" stroke="#3fb950"/><text y="4" fill="#e6edf3">Compose</text></g></g>
    </g>

    <!-- ring 2 -->
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="26s" repeatCount="indefinite"/>
      <g transform="translate(105,0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
        <rect x="-34" y="-12" width="68" height="24" rx="12" fill="#1e1b4b" stroke="#a78bfa"/><text y="4" fill="#e6edf3">Laravel</text></g></g>
    </g>
    <g><animateTransform attributeName="transform" type="rotate" from="120" to="-240" dur="26s" repeatCount="indefinite"/>
      <g transform="translate(105,0)"><g><animateTransform attributeName="transform" type="rotate" from="-120" to="240" dur="26s" repeatCount="indefinite"/>
        <rect x="-34" y="-12" width="68" height="24" rx="12" fill="#1e1b4b" stroke="#3fb950"/><text y="4" fill="#e6edf3">Vue.js</text></g></g>
    </g>
    <g><animateTransform attributeName="transform" type="rotate" from="240" to="-120" dur="26s" repeatCount="indefinite"/>
      <g transform="translate(105,0)"><g><animateTransform attributeName="transform" type="rotate" from="-240" to="120" dur="26s" repeatCount="indefinite"/>
        <rect x="-34" y="-12" width="68" height="24" rx="12" fill="#1e1b4b" stroke="#58a6ff"/><text y="4" fill="#e6edf3">React</text></g></g>
    </g>

    <!-- ring 3 -->
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
      <g transform="translate(150,0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="38s" repeatCount="indefinite"/>
        <rect x="-38" y="-12" width="76" height="24" rx="12" fill="#1e1b4b" stroke="#3fb950"/><text y="4" fill="#e6edf3">Supabase</text></g></g>
    </g>
    <g><animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="38s" repeatCount="indefinite"/>
      <g transform="translate(150,0)"><g><animateTransform attributeName="transform" type="rotate" from="-90" to="-450" dur="38s" repeatCount="indefinite"/>
        <rect x="-38" y="-12" width="76" height="24" rx="12" fill="#1e1b4b" stroke="#22d3ee"/><text y="4" fill="#e6edf3">Tailwind</text></g></g>
    </g>
    <g><animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="38s" repeatCount="indefinite"/>
      <g transform="translate(150,0)"><g><animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="38s" repeatCount="indefinite"/>
        <rect x="-38" y="-12" width="76" height="24" rx="12" fill="#1e1b4b" stroke="#facc15"/><text y="4" fill="#e6edf3">Python</text></g></g>
    </g>
    <g><animateTransform attributeName="transform" type="rotate" from="270" to="630" dur="38s" repeatCount="indefinite"/>
      <g transform="translate(150,0)"><g><animateTransform attributeName="transform" type="rotate" from="-270" to="-630" dur="38s" repeatCount="indefinite"/>
        <rect x="-38" y="-12" width="76" height="24" rx="12" fill="#1e1b4b" stroke="#f97316"/><text y="4" fill="#e6edf3">MySQL</text></g></g>
    </g>
  </g>
</svg>
