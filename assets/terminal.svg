<svg width="1000" height="225" viewBox="0 0 1000 225" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 16px; }
    .p { fill: #38bdf8; font-weight: 700; }
    .c { fill: #e2e8f0; }
    .o { fill: #67e8f9; }
    .g { fill: #34d399; }
    .d { fill: #64748b; }
    .l { opacity: 0; animation: show 0.05s forwards; }
    .l1 { animation-delay: 0.4s; }
    .l2 { animation-delay: 1.0s; }
    .l3 { animation-delay: 1.6s; }
    .l4 { animation-delay: 2.2s; }
    .l5 { animation-delay: 2.8s; }
    .l6 { animation-delay: 3.4s; }
    .cur { animation: blink 1s steps(2) infinite; fill: #38bdf8; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="1000" height="225" rx="14" fill="#070d1f" stroke="#1e293b" stroke-width="1.2"/>
  <rect width="1000" height="36" rx="14" fill="#0c1631"/>
  <rect y="22" width="1000" height="14" fill="#0c1631"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="18" r="6" fill="#27c93f"/>
  <text x="500" y="22" text-anchor="middle" class="d" style="font-size:12.5px">raztven@polinela: ~</text>

  <g class="l l1"><text x="28" y="74"><tspan class="p">$ </tspan><tspan class="c">whoami</tspan></text></g>
  <g class="l l2"><text x="28" y="100" class="o">Farras Fadhil Hassan · Software Engineer</text></g>
  <g class="l l3"><text x="28" y="134"><tspan class="p">$ </tspan><tspan class="c">cat stack.txt</tspan></text></g>
  <g class="l l4"><text x="28" y="160" class="c">Laravel · Vue.js · React · Kotlin · Jetpack Compose · Supabase</text></g>
  <g class="l l5"><text x="28" y="194"><tspan class="p">$ </tspan><tspan class="c">status</tspan></text></g>
  <g class="l l6">
    <text x="122" y="194" class="g">● open to internship &amp; collaboration</text>
    <rect class="cur" x="498" y="179" width="9" height="18" rx="1"/>
  </g>
</svg>
