<svg width="1000" height="230" viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 18px; }
    .p { fill: #a78bfa; } .c { fill: #e6edf3; } .o { fill: #3fb950; } .d { fill: #8b949e; }
    .l { opacity: 0; animation: show 0.01s forwards; }
    .l1 { animation-delay: 0.5s; } .l2 { animation-delay: 1.2s; } .l3 { animation-delay: 1.9s; }
    .l4 { animation-delay: 2.6s; } .l5 { animation-delay: 3.3s; } .l6 { animation-delay: 4s; }
    .cur { animation: blink 1s steps(2) infinite; fill: #a78bfa; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="1000" height="230" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect width="1000" height="38" rx="14" fill="#161b22"/>
