<svg width="1000" height="140" viewBox="0 0 1000 140" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.92" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1000" height="140" fill="url(#fade)"/></mask>

    <!-- Row 1: Core Web & Mobile -->
    <g id="r1" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#e2e8f0">
      <g transform="translate(0,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#f43f5e" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#f43f5e"/><text x="75" y="24" text-anchor="middle">Laravel</text>
      </g>
      <g transform="translate(145,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#10b981" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#10b981"/><text x="75" y="24" text-anchor="middle">Vue.js</text>
      </g>
      <g transform="translate(290,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#38bdf8"/><text x="75" y="24" text-anchor="middle">React</text>
      </g>
      <g transform="translate(435,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#22d3ee" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#22d3ee"/><text x="75" y="24" text-anchor="middle">Tailwind</text>
      </g>
      <g transform="translate(580,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#c084fc" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#c084fc"/><text x="75" y="24" text-anchor="middle">Kotlin</text>
      </g>
      <g transform="translate(725,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#34d399" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#34d399"/><text x="75" y="24" text-anchor="middle">Compose</text>
      </g>
      <g transform="translate(870,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#10b981" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#10b981"/><text x="75" y="24" text-anchor="middle">Supabase</text>
      </g>
      <g transform="translate(1015,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#3b82f6" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#3b82f6"/><text x="75" y="24" text-anchor="middle">TypeScript</text>
      </g>
    </g>

    <!-- Row 2: Languages, Data & Ops -->
    <g id="r2" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#e2e8f0">
      <g transform="translate(0,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#818cf8" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#818cf8"/><text x="75" y="24" text-anchor="middle">PHP 8</text>
      </g>
      <g transform="translate(145,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#facc15" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#facc15"/><text x="75" y="24" text-anchor="middle">JavaScript</text>
      </g>
      <g transform="translate(290,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#facc15" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#facc15"/><text x="75" y="24" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(435,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#f97316" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#f97316"/><text x="75" y="24" text-anchor="middle">MySQL</text>
      </g>
      <g transform="translate(580,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#60a5fa" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#60a5fa"/><text x="75" y="24" text-anchor="middle">PostgreSQL</text>
      </g>
      <g transform="translate(725,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#38bdf8"/><text x="75" y="24" text-anchor="middle">Docker</text>
      </g>
      <g transform="translate(870,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#f97316" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#f97316"/><text x="75" y="24" text-anchor="middle">Git / CI</text>
      </g>
      <g transform="translate(1015,0)">
        <rect width="130" height="38" rx="19" fill="#09152e" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="1.2"/>
        <circle cx="22" cy="19" r="4" fill="#fbbf24"/><text x="75" y="24" text-anchor="middle">IoT + AI</text>
      </g>
