  <g mask="url(#m)">
    <g transform="translate(0,18)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0,0" to="-1160,0" dur="26s" repeatCount="indefinite"/>
        <use xlink:href="#r1"/><use xlink:href="#r1" x="1160"/>
      </g>
    </g>
    <g transform="translate(0,80)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="-1160,0" to="0,0" dur="30s" repeatCount="indefinite"/>
        <use xlink:href="#r2"/><use xlink:href="#r2" x="1160"/>
      </g>
    </g>
  </g>
</svg>
