<svg width="1000" height="285" viewBox="0 0 1000 285" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1a3a"/>
      <stop offset="100%" stop-color="#050a1c"/>
    </linearGradient>
    <linearGradient id="bd1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bd2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bd3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .t { font-size: 20px; font-weight: 700; fill: #f8fafc; }
    .k { font-size: 10.5px; font-weight: 700; letter-spacing: 1.8px; fill: #fbbf24; }
    .d { font-size: 12.5px; fill: #94a3b8; }
    .c { font-size: 11.5px; fill: #a5f3fc; }
    .chip { fill: #0e2a4a; stroke: #22d3ee; stroke-opacity: 0.45; }
    .glow { stroke-dasharray: 70 240; animation: run 5s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -620; } }
    .float { animation: fl 6s ease-in-out infinite; }
    .f2 { animation-delay: 1s; } .f3 { animation-delay: 2s; }
    @keyframes fl { 50% { transform: translateY(-6px); } }
  </style>

  <!-- Card 1: EcoQuest -->
  <g class="float" transform="translate(10, 14)">
    <rect width="310" height="255" rx="16" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.25"/>
    <rect class="glow" width="310" height="255" rx="16" fill="none" stroke="url(#bd1)" stroke-width="2"/>
    <circle cx="24" cy="36" r="4" fill="#34d399"/>
    <text x="36" y="40" class="k">COMPETITION · INT'L</text>
    <text x="22" y="74" class="t">EcoQuest</text>
    <text x="22" y="106" class="d">Environmental innovation</text>
    <text x="22" y="126" class="d">platform built for 4 Force</text>
    <text x="22" y="146" class="d">Batch II Competition.</text>
    <g transform="translate(22, 174)">
      <rect class="chip" width="66" height="24" rx="12"/><text x="33" y="16" text-anchor="middle" class="c">Vue.js</text>
      <rect class="chip" x="74" width="76" height="24" rx="12"/><text x="112" y="16" text-anchor="middle" class="c">Tailwind</text>
      <rect class="chip" x="158" width="82" height="24" rx="12"/><text x="199" y="16" text-anchor="middle" class="c">Supabase</text>
      <rect class="chip" y="32" width="66" height="24" rx="12"/><text x="33" y="48" text-anchor="middle" class="c">Vercel</text>
    </g>
  </g>

  <!-- Card 2: FertiFlow -->
  <g class="float f2" transform="translate(345, 14)">
    <rect width="310" height="255" rx="16" fill="url(#card)" stroke="#fbbf24" stroke-opacity="0.25"/>
    <rect class="glow" style="animation-delay:-1.7s" width="310" height="255" rx="16" fill="none" stroke="url(#bd2)" stroke-width="2"/>
    <circle cx="24" cy="36" r="4" fill="#fbbf24"/>
    <text x="36" y="40" class="k">IOT + AI · SMART AGRI</text>
    <text x="22" y="74" class="t">FertiFlow</text>
    <text x="22" y="106" class="d">Automated chili fertigation</text>
    <text x="22" y="126" class="d">driven by IoT &amp; AI. Role:</text>
    <text x="22" y="146" class="d">System Analysis &amp; UML.</text>
    <g transform="translate(22, 174)">
      <rect class="chip" width="50" height="24" rx="12"/><text x="25" y="16" text-anchor="middle" class="c">IoT</text>
      <rect class="chip" x="58" width="44" height="24" rx="12"/><text x="80" y="16" text-anchor="middle" class="c">AI</text>
      <rect class="chip" x="110" width="56" height="24" rx="12"/><text x="138" y="16" text-anchor="middle" class="c">UML</text>
      <rect class="chip" y="32" width="118" height="24" rx="12"/><text x="59" y="48" text-anchor="middle" class="c">System Design</text>
    </g>
  </g>

  <!-- Card 3: Mobile & Web Systems -->
  <g class="float f3" transform="translate(680, 14)">
    <rect width="310" height="255" rx="16" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.25"/>
    <rect class="glow" style="animation-delay:-3.4s" width="310" height="255" rx="16" fill="none" stroke="url(#bd3)" stroke-width="2"/>
    <circle cx="24" cy="36" r="4" fill="#38bdf8"/>
    <text x="36" y="40" class="k">MOBILE &amp; FULL-STACK</text>
    <text x="22" y="74" class="t">Finance &amp; Web Apps</text>
    <text x="22" y="106" class="d">Android Personal Finance,</text>
    <text x="22" y="126" class="d">AbsenSiswa &amp; V2peternak</text>
    <text x="22" y="146" class="d">management platforms.</text>
    <g transform="translate(22, 174)">
      <rect class="chip" width="64" height="24" rx="12"/><text x="32" y="16" text-anchor="middle" class="c">Kotlin</text>
      <rect class="chip" x="72" width="76" height="24" rx="12"/><text x="110" y="16" text-anchor="middle" class="c">Compose</text>
      <rect class="chip" x="156" width="74" height="24" rx="12"/><text x="193" y="16" text-anchor="middle" class="c">Laravel</text>
      <rect class="chip" y="32" width="64" height="24" rx="12"/><text x="32" y="48" text-anchor="middle" class="c">MySQL</text>
    </g>
  </g>
</svg>
