<svg width="1000" height="270" viewBox="0 0 1000 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1a3a"/>
      <stop offset="100%" stop-color="#050a1c"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
    .t { font-size: 20px; font-weight: 700; fill: #f1f5f9; }
    .k { font-size: 11px; letter-spacing: 2px; fill: #fbbf24; }
    .d { font-size: 13px; fill: #94a3b8; }
    .c { font-size: 12px; fill: #a5f3fc; }
    .chip { fill: #0e2a4a; stroke: #22d3ee; stroke-opacity: 0.45; }
    .glow { stroke-dasharray: 60 240; animation: run 5s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -600; } }
    .float { animation: fl 6s ease-in-out infinite; }
    .f2 { animation-delay: 1s; } .f3 { animation-delay: 2s; }
    @keyframes fl { 50% { transform: translateY(-6px); } }
  </style>

  <!-- card 1 -->
  <g class="float" transform="translate(10,10)">
    <rect width="310" height="240" rx="16" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.25"/>
    <rect class="glow" width="310" height="240" rx="16" fill="none" stroke="url(#bd)" stroke-width="2"/>
    <text x="22" y="40" class="k">COMPETITION</text>
    <text x="22" y="72" class="t">EcoQuest</text>
    <text x="22" y="104" class="d">International Innovation</text>
    <text x="22" y="124" class="d">4 Force Batch II.</text>
    <g transform="translate(22,160)">
      <rect class="chip" width="62" height="24" rx="12"/><text x="31" y="16" text-anchor="middle" class="c">Vue.js</text>
      <rect class="chip" x="70" width="76" height="24" rx="12"/><text x="108" y="16" text-anchor="middle" class="c">Tailwind</text>
      <rect class="chip" x="154" width="82" height="24" rx="12"/><text x="195" y="16" text-anchor="middle" class="c">Supabase</text>
      <rect class="chip" y="32" width="66" height="24" rx="12"/><text x="33" y="48" text-anchor="middle" class="c">Vercel</text>
    </g>
  </g>

  <!-- card 2 -->
  <g class="float f2" transform="translate(345,10)">
    <rect width="310" height="240" rx="16" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.25"/>
    <rect class="glow" style="animation-delay:-1.7s" width="310" height="240" rx="16" fill="none" stroke="url(#bd)" stroke-width="2"/>
    <text x="22" y="40" class="k">IOT + AI</text>
    <text x="22" y="72" class="t">FertiFlow</text>
    <text x="22" y="104" class="d">Fertigasi cabai berbasis IoT</text>
    <text x="22" y="124" class="d">dan AI. Peran: analisis</text>
    <text x="22" y="144" class="d">kebutuhan &amp; UML.</text>
    <g transform="translate(22,176)">
      <rect class="chip" width="46" height="24" rx="12"/><text x="23" y="16" text-anchor="middle" class="c">IoT</text>
      <rect class="chip" x="54" width="40" height="24" rx="12"/><text x="74" y="16" text-anchor="middle" class="c">AI</text>
      <rect class="chip" x="102" width="52" height="24" rx="12"/><text x="128" y="16" text-anchor="middle" class="c">UML</text>
    </g>
  </g>

  <!-- card 3 -->
  <g class="float f3" transform="translate(680,10)">
    <rect width="310" height="240" rx="16" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.25"/>
    <rect class="glow" style="animation-delay:-3.4s" width="310" height="240" rx="16" fill="none" stroke="url(#bd)" stroke-width="2"/>
    <text x="22" y="40" class="k">MOBILE</text>
    <text x="22" y="72" class="t">Personal Finance</text>
    <text x="22" y="104" class="d">Aplikasi Android untuk</text>
    <text x="22" y="124" class="d">mencatat keuangan pribadi.</text>
    <g transform="translate(22,160)">
      <rect class="chip" width="64" height="24" rx="12"/><text x="32" y="16" text-anchor="middle" class="c">Kotlin</text>
      <rect class="chip" x="72" width="116" height="24" rx="12"/><text x="130" y="16" text-anchor="middle" class="c">Jetpack Compose</text>
    </g>
  </g>
</svg>
