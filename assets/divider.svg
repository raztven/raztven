<svg width="1000" height="26" viewBox="0 0 1000 26" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="35%" stop-color="#0891b2" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#0891b2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="12" width="1000" height="2" fill="url(#g)"/>

  <!-- Outward Sliding Energy Pulses -->
  <rect x="500" y="11" width="90" height="4" rx="2" fill="url(#pulse)">
    <animate attributeName="x" values="500;940" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="410" y="11" width="90" height="4" rx="2" fill="url(#pulse)">
    <animate attributeName="x" values="410;-30" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Center Star Beacon -->
  <path d="M500 2 L505 13 L500 24 L495 13 Z" fill="#fbbf24">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <circle cx="500" cy="13" r="3" fill="#fff"/>
</svg>
