<svg width="1000" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d20"/>
      <stop offset="100%" stop-color="#09142e"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="1000" height="150" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
  </style>

  <!-- Minimalist Card Frame -->
  <rect width="1000" height="150" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>

  <g clip-path="url(#cardClip)">
    <!-- Soft Ambient Wave -->
    <path d="M 0 112 C 240 84, 460 132, 720 102 C 860 88, 940 112, 1000 102 L 1000 150 L 0 150 Z" fill="url(#waveGrad)"/>
    <path d="M 0 122 C 260 140, 520 96, 780 120 C 890 130, 950 112, 1000 118 L 1000 150 L 0 150 Z" fill="url(#waveGrad)" opacity="0.6"/>
  </g>

  <!-- Minimalist Horizontal Track -->
  <line x1="160" y1="64" x2="840" y2="64" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Sliding Light Pulse -->
  <rect y="63" width="140" height="2" rx="1" fill="url(#pulseGrad)">
    <animate attributeName="x" values="100;760" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Node 1: 01 · DESIGN -->
  <g transform="translate(160, 64)">
    <circle r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="14;24" dur="3.6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3.6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="#0b1730" stroke="#38bdf8" stroke-width="1.5"/>
    <circle r="4" fill="#38bdf8"/>
    <text y="34" text-anchor="middle" class="mono" font-size="11" fill="#94a3b8" letter-spacing="1.2">01 · DESIGN</text>
  </g>

  <!-- Node 2: 02 · CODE -->
  <g transform="translate(386, 64)">
    <circle r="14" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="14;24" dur="3.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3.6s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="#0b1730" stroke="#22d3ee" stroke-width="1.5"/>
    <circle r="4" fill="#22d3ee"/>
    <text y="34" text-anchor="middle" class="mono" font-size="11" fill="#94a3b8" letter-spacing="1.2">02 · CODE</text>
  </g>

  <!-- Node 3: 03 · BUILD -->
  <g transform="translate(613, 64)">
    <circle r="14" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="14;24" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="#0b1730" stroke="#34d399" stroke-width="1.5"/>
    <circle r="4" fill="#34d399"/>
    <text y="34" text-anchor="middle" class="mono" font-size="11" fill="#94a3b8" letter-spacing="1.2">03 · BUILD</text>
  </g>

  <!-- Node 4: 04 · SHIP -->
  <g transform="translate(840, 64)">
    <circle r="14" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="14;24" dur="3.6s" begin="2.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3.6s" begin="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="#0b1730" stroke="#fbbf24" stroke-width="1.5"/>
    <circle r="4" fill="#fbbf24"/>
    <text y="34" text-anchor="middle" class="mono" font-size="11" fill="#94a3b8" letter-spacing="1.2">04 · SHIP</text>
  </g>
</svg>
