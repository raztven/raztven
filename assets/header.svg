<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1a1333"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="clip"><rect width="1000" height="260" rx="20"/></clipPath>
  </defs>

  <rect width="1000" height="260" rx="20" fill="url(#bg)"/>

  <g clip-path="url(#clip)">
    <g filter="url(#blur)" opacity="0.65">
      <circle cx="160" cy="80" r="80" fill="#7c3aed">
        <animate attributeName="cx" values="160;320;160" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="80;150;80" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="860" cy="190" r="95" fill="#c026d3">
        <animate attributeName="cx" values="860;700;860" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="190;110;190" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="20" r="60" fill="#58a6ff">
        <animate attributeName="cy" values="20;90;20" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="520;600;520" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g fill="#ffffff">
      <circle cx="80" cy="50" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="210" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="40" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="410" cy="225" r="1.4"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.5s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="35" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="225" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.5s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="55" r="1.7"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="150" r="1.2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.2s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="50" cy="160" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.8s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="540" cy="235" r="1.1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="258" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <text x="500" y="118" text-anchor="middle" font-size="52" font-weight="700"
        font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="url(#name)">Farras Fadhil Hassan</text>
  <rect x="300" y="136" width="400" height="2" fill="url(#line)">
    <animate attributeName="width" values="120;400;120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="440;300;440" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="176" text-anchor="middle" font-size="16" letter-spacing="5"
        font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#c4b5fd">SOFTWARE ENGINEER · FULL-STACK · MOBILE</text>
  <text x="500" y="208" text-anchor="middle" font-size="13" letter-spacing="2"
        font-family="JetBrains Mono, Menlo, Consolas, monospace" fill="#8b949e">D4 TRPL · POLITEKNIK NEGERI LAMPUNG</text>
</svg>
