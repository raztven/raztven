<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#58a6ff" flood-opacity="0.6"/>
    </filter>
    <filter id="subtextShadow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#58a6ff" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes orbPulse1 {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    @keyframes orbPulse2 {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.95; }
    }
    @keyframes orbPulse3 {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.85; }
    }
    @keyframes cornerGlow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @keyframes scanline {
      0% { transform: translateY(-280px); }
      100% { transform: translateY(280px); }
    }
    @keyframes textPulse {
      0%, 100% { filter: url(#textShadow); opacity: 1; }
      50% { opacity: 0.92; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -24; }
    }
    .orb1 { animation: orbPulse1 4s ease-in-out infinite; }
    .orb2 { animation: orbPulse2 5.5s ease-in-out infinite 0.8s; }
    .orb3 { animation: orbPulse3 6s ease-in-out infinite 2s; }
    .corners { animation: cornerGlow 3s ease-in-out infinite; }
    .dash-line { animation: dashMove 1.5s linear infinite; }
    .title { animation: textPulse 4s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bgGrad)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.12">
    <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#58a6ff"/>
    </pattern>
    <rect width="1200" height="280" fill="url(#dotGrid)"/>
  </g>

  <!-- Scanline shimmer -->
  <rect width="1200" height="3" fill="white" opacity="0.03" class="scanline"/>

  <!-- Glow orbs -->
  <ellipse class="orb1" cx="160" cy="200" rx="250" ry="180" fill="url(#glow1)" filter="url(#blur)"/>
  <ellipse class="orb2" cx="1050" cy="80" rx="230" ry="170" fill="url(#glow2)" filter="url(#blur)"/>
  <ellipse class="orb3" cx="600" cy="270" rx="350" ry="120" fill="url(#glow3)" filter="url(#blur)"/>

  <!-- Frame corners -->
  <g class="corners">
    <!-- Top-left -->
    <rect x="24" y="24" width="40" height="2" fill="#58a6ff"/>
    <rect x="24" y="24" width="2" height="40" fill="#58a6ff"/>
    <circle cx="24" cy="24" r="3" fill="#58a6ff"/>
    <!-- Top-right -->
    <rect x="1136" y="24" width="40" height="2" fill="#a78bfa"/>
    <rect x="1174" y="24" width="2" height="40" fill="#a78bfa"/>
    <circle cx="1176" cy="24" r="3" fill="#a78bfa"/>
    <!-- Bottom-left -->
    <rect x="24" y="254" width="40" height="2" fill="#58a6ff"/>
    <rect x="24" y="216" width="2" height="40" fill="#58a6ff"/>
    <circle cx="24" cy="256" r="3" fill="#58a6ff"/>
    <!-- Bottom-right -->
    <rect x="1136" y="254" width="40" height="2" fill="#a78bfa"/>
    <rect x="1174" y="216" width="2" height="40" fill="#a78bfa"/>
    <circle cx="1176" cy="256" r="3" fill="#a78bfa"/>
  </g>

  <!-- Decorative horizontal lines top/bottom -->
  <line x1="80" y1="50" x2="1120" y2="50" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="80" y1="230" x2="1120" y2="230" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Side accent dots -->
  <g opacity="0.4">
    <circle cx="60" cy="100" r="2" fill="#58a6ff"/>
    <circle cx="60" cy="140" r="2" fill="#58a6ff"/>
    <circle cx="60" cy="180" r="2" fill="#58a6ff"/>
    <circle cx="1140" cy="100" r="2" fill="#a78bfa"/>
    <circle cx="1140" cy="140" r="2" fill="#a78bfa"/>
    <circle cx="1140" cy="180" r="2" fill="#a78bfa"/>
  </g>

  <!-- Main title -->
  <text class="title" x="600" y="132" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="74" font-weight="900"
    fill="url(#textGrad)"
    letter-spacing="12"
    filter="url(#textShadow)">RAZTVEN</text>

  <!-- Animated dash line -->
  <line class="dash-line" x1="320" y1="155" x2="880" y2="155"
    stroke="url(#lineGrad)" stroke-width="1"
    stroke-dasharray="6,6" stroke-dashoffset="0"/>

  <!-- Subtitle -->
  <text x="600" y="188" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="15" letter-spacing="4"
    fill="#94a3b8"
    filter="url(#subtextShadow)">FULL-STACK · MOBILE DEVELOPER · IoT ENGINEER</text>

  <!-- Bottom tagline -->
  <text x="600" y="218" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="12" letter-spacing="2"
    fill="#475569">Politeknik Negeri Lampung — D4 TRPL — Indonesia</text>

  <!-- Small accent circles on dash line -->
  <circle cx="320" cy="155" r="3" fill="#58a6ff" opacity="0.8"/>
  <circle cx="880" cy="155" r="3" fill="#a78bfa" opacity="0.8"/>
</svg>
